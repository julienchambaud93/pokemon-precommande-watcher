name: Surveillance précommandes Pokémon

on:
  schedule:
    - cron: "*/5 * * * *"     # toutes les 5 minutes (minimum autorisé par GitHub)
  workflow_dispatch:           # bouton "Run workflow" pour un lancement manuel
    inputs:
      mode:
        description: "Mode d'exécution"
        type: choice
        default: surveillance
        options:
          - surveillance       # normal : n'alerte que sur du nouveau / retour en stock
          - rapport            # envoie un compte-rendu immédiat sur Telegram
          - test               # envoie un simple message de test Telegram

# Autorise le job à ré-écrire state.json dans le dépôt
permissions:
  contents: write

# Empêche deux exécutions de se chevaucher
concurrency:
  group: pokemon-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Déclenche IMMÉDIATEMENT la prochaine exécution (mise « en attente » par concurrency, elle prendra
      # le relais dès que celle-ci se termine — même si elle plante). Rend la surveillance indépendante du
      # planificateur GitHub (qui laissait des trous, surtout la nuit). Nécessite le secret CHAIN_PAT.
      - name: Auto-chaînage de la prochaine exécution
        if: github.event.inputs.mode != 'rapport' && github.event.inputs.mode != 'test'
        env:
          CHAIN_PAT: ${{ secrets.CHAIN_PAT }}
        run: |
          set +e
          if [ -n "$CHAIN_PAT" ]; then
            curl -s -o /dev/null -w "auto-chaînage -> HTTP %{http_code}\n" -X POST \
              -H "Authorization: Bearer $CHAIN_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches" \
              -d '{"ref":"main","inputs":{"mode":"surveillance"}}'
          else
            echo "CHAIN_PAT absent -> auto-chaînage désactivé (on retombe sur le planificateur GitHub)."
          fi

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Surveillance (boucle ~50 min) ou action ponctuelle
        env:
          MODE: ${{ github.event.inputs.mode }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Email (phase 2) — laisser vide tant que non configuré :
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEST_ALERT: ${{ secrets.TEST_ALERT }}
        run: |
          set +e   # NE JAMAIS tuer la boucle sur un code de retour anodin (git / réseau / etc.)
          git config user.name "pokemon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sauvegarde l'état + heartbeat quotidien (commit seulement si changement)
          sauver_etat () {
            date -u +%Y-%m-%d > heartbeat.txt
            if [ -n "$(git status --porcelain state.json heartbeat.txt)" ]; then
              git add state.json heartbeat.txt
              git commit -q -m "maj état surveillance"
              git pull -q --rebase 2>/dev/null || true
              git push -q 2>/dev/null || true
            fi
          }

          if [ "$MODE" = "rapport" ] || [ "$MODE" = "test" ]; then
            # Action ponctuelle (déclenchement manuel) : une seule exécution
            python monitor.py
          else
            # Surveillance : boucle ~50 min, vérification toutes les 2 min.
            # La continuité est désormais assurée par l'AUTO-CHAÎNAGE (étape ci-dessus) : la prochaine
            # exécution est déjà en attente et démarre dès la fin de celle-ci. Des boucles courtes = reprise
            # rapide en cas de pépin + attente en file d'attente courte (fiable).
            fin=$((SECONDS + 3000))
            while [ $SECONDS -lt $fin ]; do
              t0=$SECONDS
              python monitor.py || true
              sauver_etat
              # viser un cycle total de ~120 s : on retire le temps déjà passé à scanner
              reste=$((120 - (SECONDS - t0)))
              [ $reste -lt 15 ] && reste=15          # au moins 15 s de pause (poli avec les serveurs)
              [ $SECONDS -lt $fin ] && sleep $reste
            done
          fi
